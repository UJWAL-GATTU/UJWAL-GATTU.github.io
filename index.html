<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujwal Gattu | Offensive Security Lab</title>

<style>
:root {
    --bg-color: #0a0f1c;
    --card-bg: rgba(30, 41, 59, 0.7);
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #00ffcc;
    --accent-glow: rgba(0,255,204,0.4);
    --font-main: system-ui, -apple-system, sans-serif;
    --font-mono: 'Courier New', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-main);
    overflow-x: hidden;
}

/* Progress Bar */
#progress-container {
    position: fixed;
    top: 0;
    width: 100%;
    height: 4px;
    z-index: 1001;
}
#progress-bar {
    height: 4px;
    background: var(--accent);
    width: 0%;
    box-shadow: 0 0 10px var(--accent);
}

/* Background Canvas */
#canvas-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -1;
    opacity: 0.25;
}

/* NAV */
nav {
    position: fixed;
    width: 100%;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(10px);
    background: rgba(10,15,28,0.6);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    z-index: 1000;
}
.logo {
    font-family: var(--font-mono);
    color: var(--accent);
    font-weight: bold;
    letter-spacing: 2px;
}
.nav-links a {
    color: var(--text-muted);
    margin-left: 30px;
    text-decoration: none;
    font-size: 0.9rem;
    transition: 0.3s;
}
.nav-links a:hover { color: var(--accent); }

/* HERO */
.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 20px;
    max-width: 900px;
    margin: auto;
}

.init-text {
    color: var(--accent);
    font-family: var(--font-mono);
    margin-bottom: 20px;
}

.glitch {
    position: relative;
    font-size: 4.5rem;
    text-transform: uppercase;
    letter-spacing: 4px;
    text-shadow:
        0 0 8px var(--accent),
        0 0 20px rgba(0,255,204,0.4);
}

.glitch::before,
.glitch::after {
    content: attr(data-text);
    position: absolute;
    left: 0;
    width: 100%;
}

.glitch::before {
    color: #00ffff;
    animation: glitchTop 2s infinite linear alternate-reverse;
    clip-path: inset(0 0 50% 0);
}
.glitch::after {
    color: #00ffaa;
    animation: glitchBottom 1.5s infinite linear alternate-reverse;
    clip-path: inset(50% 0 0 0);
}

@keyframes glitchTop {
    0% { transform: translate(0); }
    50% { transform: translate(-2px, -2px); }
    100% { transform: translate(0); }
}
@keyframes glitchBottom {
    0% { transform: translate(0); }
    50% { transform: translate(2px, 2px); }
    100% { transform: translate(0); }
}

.subtitle {
    font-size: 1.8rem;
    color: var(--accent);
    font-family: var(--font-mono);
    margin: 20px 0;
    min-height: 1.6em;
}

.cursor {
    animation: blink 1s infinite;
}
@keyframes blink {
    50% { opacity: 0; }
}

.hero p {
    max-width: 600px;
    color: var(--text-muted);
    margin-bottom: 40px;
}

/* BUTTON */
.btn {
    display: inline-block;
    padding: 14px 32px;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 4px;
    font-family: var(--font-mono);
    text-decoration: none;
    background: rgba(0,255,204,0.05);
    transition: 0.3s;
    position: relative;
    overflow: hidden;
}
.btn::before {
    content: "";
    position: absolute;
    left: -100%;
    top: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(0,255,204,0.3), transparent);
    transition: 0.5s;
}
.btn:hover::before { left: 100%; }
.btn:hover {
    box-shadow: 0 0 20px var(--accent-glow);
    transform: translateY(-3px);
}

/* FOOTER */
footer {
    text-align: center;
    padding: 60px 0;
    font-family: var(--font-mono);
    color: var(--text-muted);
}

/* MOBILE */
@media(max-width:768px){
    .glitch { font-size: 3rem; }
}
</style>
</head>

<body>

<div id="progress-container"><div id="progress-bar"></div></div>
<canvas id="canvas-bg"></canvas>

<nav>
    <div class="logo">&lt;UG /&gt;</div>
    <div class="nav-links">
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="/writeups/">Writeups</a>
        <a href="#contact">Contact</a>
    </div>
</nav>

<header class="hero">
    <a href="/writeups/" class="btn" style="margin-bottom:30px;">Write-ups→</a>

    <p class="init-text">initializing offensive_security_profile...</p>

    <h1 class="glitch" data-text="UJWAL GATTU">UJWAL GATTU</h1>

    <h2 class="subtitle">
        I <span id="typing-text"></span><span class="cursor">|</span>
    </h2>

    <p>
        Building offensive tooling, simulating real-world attacks,
        and engineering AI-driven security systems.
    </p>

    <div>
        <a href="mailto:gattuujwal037@gmail.com" class="btn">Get In Touch</a>
        <a href="https://github.com/UJWAL-GATTU" target="_blank" class="btn" style="margin-left:15px;">GitHub</a>
    </div>
</header>

<footer>
    Built by Ujwal Gattu.
</footer>

<script>
// Typing Effect
const textElement = document.getElementById('typing-text');
const phrases = [
    "exploit misconfigurations.",
    "simulate real-world attacks.",
    "hunt vulnerabilities.",
    "engineer secure systems."
];
let phraseIndex = 0, charIndex = 0, isDeleting = false;

function type() {
    const currentPhrase = phrases[phraseIndex];
    if (isDeleting) {
        textElement.textContent = currentPhrase.substring(0, charIndex--);
    } else {
        textElement.textContent = currentPhrase.substring(0, charIndex++);
    }
    let speed = isDeleting ? 50 : 100;
    if (!isDeleting && charIndex === currentPhrase.length) {
        speed = 1500;
        isDeleting = true;
    } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        phraseIndex = (phraseIndex + 1) % phrases.length;
    }
    setTimeout(type, speed);
}
document.addEventListener('DOMContentLoaded', type);

// Scroll Progress
window.onscroll = function() {
    let winScroll = document.documentElement.scrollTop;
    let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    document.getElementById("progress-bar").style.width = (winScroll / height) * 100 + "%";
};

// Background Particles
const canvas = document.getElementById('canvas-bg');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
    constructor(){
        this.x = Math.random()*canvas.width;
        this.y = Math.random()*canvas.height;
        this.dx = (Math.random()-0.5)*1;
        this.dy = (Math.random()-0.5)*1;
        this.size = Math.random()*2;
    }
    update(){
        if(this.x>canvas.width||this.x<0) this.dx*=-1;
        if(this.y>canvas.height||this.y<0) this.dy*=-1;
        this.x+=this.dx; this.y+=this.dy;
        this.draw();
    }
    draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fillStyle='#00ffcc';
        ctx.fill();
    }
}
let particles=[];
for(let i=0;i<60;i++) particles.push(new Particle());

function animate(){
    requestAnimationFrame(animate);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        p.update();
        particles.forEach(p2=>{
            let dist=Math.hypot(p.x-p2.x,p.y-p2.y);
            if(dist<100){
                ctx.strokeStyle=`rgba(0,255,204,${1-dist/100})`;
                ctx.beginPath();
                ctx.moveTo(p.x,p.y);
                ctx.lineTo(p2.x,p2.y);
                ctx.stroke();
            }
        });
    });
}
animate();
</script>

</body>
</html>
